chor="start">Study body mode</text><rect x="64" y="200" width="472" height="34" rx="8" fill="#E3F1FB" stroke="#C4D9EA" stroke-width="1.5"/><text x="64" y="276" font-size="15" font-weight="600" fill="#0B1626" text-anchor="start">Male</text><rect x="120" y="258" width="48" height="24" rx="12" fill="#0B1626"/><circle cx="156" cy="270" r="9" fill="#FFFFFF"/><rect x="64" y="320" width="220" height="38" rx="19.0" fill="#FFFFFF" stroke="#0B1626" stroke-width="1.5"/><text x="174.0" y="344.0" font-size="15" font-weight="600" fill="#0B1626" text-anchor="middle">Normalize height</text><rect x="300" y="320" width="236" height="38" rx="19.0" fill="#FFB547" stroke="#B87A24" stroke-width="1.5"/><text x="418.0" y="344.0" font-size="15" font-weight="600" fill="#0B1626" text-anchor="middle">Start EVC conversation</text><rect x="600" y="40" width="560" height="420" rx="14" fill="#FFFFFF" stroke="#24405F" stroke-width="2"/><path d="M601,84 L1159,84" stroke="#C4D9EA" stroke-width="2"/><text x="620" y="69" font-size="17" font-weight="650" fill="#0B1626" text-anchor="start">Game view</text><rect x="620" y="100" width="520" height="280" rx="10" fill="#0B1626" stroke="#0B1626" stroke-width="2"/><rect x="620" y="394" width="520" height="48" rx="10" fill="#E3F1FB" stroke="#4A8DB8" stroke-width="2"/><rect x="636" y="404" width="112" height="28" rx="14" fill="#FFFFFF" stroke="#C4D9EA" stroke-width="1.5"/><rect x="762" y="404" width="112" height="28" rx="14" fill="#FFFFFF" stroke="#C4D9EA" stroke-width="1.5"/><rect x="888" y="404" width="112" height="28" rx="14" fill="#FFFFFF" stroke="#C4D9EA" stroke-width="1.5"/><rect x="1014" y="404" width="112" height="28" rx="14" fill="#FFFFFF" stroke="#C4D9EA" stroke-width="1.5"/><text x="880" y="372" font-size="14" font-weight="500" fill="#B5DEF7" text-anchor="middle">On-screen control strip below</text></svg>