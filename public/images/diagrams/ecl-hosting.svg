<svg xmlns="http://www.w3.org/2000/svg" viewBox="58 -2 948 271" width="948" height="271" role="img" aria-label="ECL website hosting: an editor saves in the Payload CMS on Cloud Run with Turso and R2, a content snapshot is fetched at build time, Astro prerenders HTML and deploys it as a static site on a Cloudflare Worker. A rebuild hook from the CMS triggers the build on each save." font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title>ECL website hosting: an editor saves in the Payload CMS on Cloud Run with Turso and R2, a content snapshot is fetched at build time, Astro prerenders HTML and deploys it as a static site on a Cloudflare Worker. A rebuild hook from the CMS triggers the build on each save.</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#24405F"/></marker><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B87A24"/></marker></defs><rect x="58" y="-2" width="948" height="271" fill="#FFFFFF"/><path d="M230.0,90.0 L258.5,90.0 Q268.5,90.0 278.5,90.0 L307.0,90.0" fill="none" stroke="#24405F" stroke-width="2" marker-end="url(#a)"/><path d="M503.0,90.0 L521.8,90.0 Q531.8,90.0 541.8,90.0 L560.5,90.0" fill="none" stroke="#24405F" stroke-width="2" marker-end="url(#a)"/><path d="M749.5,90.0 L779.2,90.0 Q789.2,90.0 799.2,90.0 L829.0,90.0" fill="none" stroke="#24405F" stroke-width="2" marker-end="url(#a)"/><path d="M905.0,126.5 L905.0,140.0 Q905.0,150.0 905.0,160.0 L905.0,173.5" fill="none" stroke="#24405F" stroke-width="2" marker-end="url(#a)"/><path d="M405.0,53.5 L405.0,29.5 Q405.0,19.5 415.0,19.5 L895.0,19.5 Q905.0,19.5 905.0,29.5 L905.0,53.5" fill="none" stroke="#B87A24" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah)"/><rect x="80.0" y="53.5" width="150" height="73" rx="11" fill="#B5DEF7" stroke="#1B5A87" stroke-width="2"/><text x="155.0" y="84.5" text-anchor="middle" font-size="16" font-weight="650" fill="#0B1626">Editor</text><text x="155.0" y="105.5" text-anchor="middle" font-size="14" fill="#13233A">saves a page</text><rect x="307.0" y="53.5" width="196" height="73" rx="11" fill="#FFFFFF" stroke="#24405F" stroke-width="2"/><text x="405.0" y="84.5" text-anchor="middle" font-size="16" font-weight="650" fill="#0B1626">CMS (Payload)</text><text x="405.0" y="105.5" text-anchor="middle" font-size="14" fill="#4A6480">Cloud Run + Turso + R2</text><rect x="560.5" y="53.5" width="189" height="73" rx="11" fill="#FFF4DC" stroke="#B87A24" stroke-width="2"/><text x="655.0" y="84.5" text-anchor="middle" font-size="16" font-weight="650" fill="#0B1626">Content snapshot</text><text x="655.0" y="105.5" text-anchor="middle" font-size="14" fill="#6B4710">fetched at build time</text><rect x="829.0" y="53.5" width="152" height="73" rx="11" fill="#0B1626" stroke="#0B1626" stroke-width="2"/><text x="905.0" y="84.5" text-anchor="middle" font-size="16" font-weight="650" fill="#F4FAFF">Astro build</text><text x="905.0" y="105.5" text-anchor="middle" font-size="14" fill="#B5DEF7">prerendered HTML</text><rect x="825.5" y="173.5" width="159" height="73" rx="11" fill="#FFB547" stroke="#B87A24" stroke-width="2"/><text x="905.0" y="204.5" text-anchor="middle" font-size="16" font-weight="650" fill="#0B1626">Static site</text><text x="905.0" y="225.5" text-anchor="middle" font-size="14" fill="#13233A">Cloudflare Worker</text><text x="249.2" y="81.0" text-anchor="middle" font-size="14" font-weight="500" fill="#24405F" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" paint-order="stroke">save</text><text x="517.4" y="81.0" text-anchor="middle" font-size="14" font-weight="500" fill="#24405F" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" paint-order="stroke">REST</text><text x="915.0" y="143.2" text-anchor="start" font-size="14" font-weight="500" fill="#24405F" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" paint-order="stroke">deploy</text><text x="655.0" y="10.5" text-anchor="middle" font-size="14" font-weight="500" fill="#24405F" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" paint-order="stroke">rebuild hook</text></svg>