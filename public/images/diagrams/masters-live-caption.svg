<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Diagram: push-to-talk on a controller trigger goes to speech-to-text, and the recognised words appear as a caption at the bottom of the headset view, below the character." font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title>Diagram: push-to-talk on a controller trigger goes to speech-to-text, and the recognised words appear as a caption at the bottom of the headset view, below the character.</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#24405F"/></marker><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B87A24"/></marker></defs><rect width="1200" height="480" fill="#FFFFFF"/><rect x="40" y="190" width="210" height="96" rx="12" fill="#FFFFFF" stroke="#24405F" stroke-width="2"/><text x="145.0" y="221.0" font-size="19" font-weight="600" fill="#0B1626" text-anchor="middle">Push-to-talk</text><text x="145.0" y="249.0" font-size="15" font-weight="400" fill="#4A6480" text-anchor="middle">either controller</text><text x="145.0" y="269.0" font-size="15" font-weight="400" fill="#4A6480" text-anchor="middle">trigger</text><path d="M250,238 L300,238" fill="none" stroke="#24405F" stroke-width="2" marker-end="url(#a)"/><rect x="300" y="190" width="210" height="96" rx="12" fill="#FFFFFF" stroke="#24405F" stroke-width="2"/><text x="405.0" y="231.0" font-size="19" font-weight="600" fill="#0B1626" text-anchor="middle">Speech to text</text><text x="405.0" y="259.0" font-size="15" font-weight="400" fill="#4A6480" text-anchor="middle">local speech server</text><path d="M510,238 L570,238" fill="none" stroke="#24405F" stroke-width="2" marker-end="url(#a)"/><rect x="570" y="50" width="590" height="380" rx="28" fill="#0B1626" stroke="#0B1626" stroke-width="2"/><path d="M823.0,330 L823.0,220.80000000000004 Q823.0,183.00000000000003 865,183.00000000000003 Q907.0,183.00000000000003 907.0,220.80000000000004 L907.0,330 Z" fill="#4A8DB8"/><circle cx="865" cy="147.3" r="27.3" fill="#4A8DB8"/><circle cx="865" cy="147.3" r="16.926000000000002" fill="#B5DEF7"/><rect x="620" y="345" width="490" height="56" rx="12" fill="#FFFFFF" stroke="#B87A24" stroke-width="3"/><text x="865" y="380" font-size="18" font-weight="600" fill="#0B1626" text-anchor="middle">"…what the system heard…"</text><text x="865" y="90" font-size="16" font-weight="600" fill="#B5DEF7" text-anchor="middle">Headset view</text><text x="865" y="458" font-size="15" font-weight="500" fill="#4A6480" text-anchor="middle">The caption sits at the bottom of the view</text></svg>