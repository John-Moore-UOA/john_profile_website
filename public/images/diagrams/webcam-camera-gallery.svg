<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Diagram of the photo pipeline: the virtual camera&#x27;s view frustum is intersected with the bench plane, mapped into webcam pixels with the bench calibration, the frame is warped into a photo, and the photo goes to a gallery panel where pointing at an object counts as gazing at it." font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title>Diagram of the photo pipeline: the virtual camera&#x27;s view frustum is intersected with the bench plane, mapped into webcam pixels with the bench calibration, the frame is warped into a photo, and the photo goes to a gallery panel where pointing at an object counts as gazing at it.</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#24405F"/></marker><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B87A24"/></marker></defs><rect width="1200" height="400" fill="#FFFFFF"/><rect x="40" y="90" width="200" height="130" rx="12" fill="#FFFFFF" stroke="#24405F" stroke-width="2"/><text x="140.0" y="138.0" font-size="19" font-weight="600" fill="#0B1626" text-anchor="middle">Virtual camera</text><text x="140.0" y="166.0" font-size="15" font-weight="400" fill="#4A6480" text-anchor="middle">viewfinder and</text><text x="140.0" y="186.0" font-size="15" font-weight="400" fill="#4A6480" text-anchor="middle">shutter</text><path d="M240,155 L268,155" fill="none" stroke="#24405F" stroke-width="2" marker-end="url(#a)"/><rect x="268" y="90" width="200" height="130" rx="12" fill="#FFFFFF" stroke="#24405F" stroke-width="2"/><text x="368.0" y="137.0" font-size="19" font-weight="600" fill="#0B1626" text-anchor="middle">View frustum</text><text x="368.0" y="161.0" font-size="19" font-weight="600" fill="#0B1626" text-anchor="middle">meets the bench</text><text x="368.0" y="185.0" font-size="19" font-weight="600" fill="#0B1626" text-anchor="middle">plane</text><path d="M468,155 L496,155" fill="none" stroke="#24405F" stroke-width="2" marker-end="url(#a)"/><rect x="496" y="90" width="200" height="130" rx="12" fill="#FFFFFF" stroke="#24405F" stroke-width="2"/><text x="596.0" y="136.0" font-size="19" font-weight="600" fill="#0B1626" text-anchor="middle">Map into webcam</text><text x="596.0" y="160.0" font-size="19" font-weight="600" fill="#0B1626" text-anchor="middle">pixels</text><text x="596.0" y="188.0" font-size="15" font-weight="400" fill="#4A6480" text-anchor="middle">bench calibration</text><path d="M696,155 L724,155" fill="none" stroke="#24405F" stroke-width="2" marker-end="url(#a)"/><rect x="724" y="90" width="200" height="130" rx="12" fill="#FFFFFF" stroke="#24405F" stroke-width="2"/><text x="824.0" y="149.0" font-size="19" font-weight="600" fill="#0B1626" text-anchor="middle">Warp the frame</text><text x="824.0" y="173.0" font-size="19" font-weight="600" fill="#0B1626" text-anchor="middle">into a photo</text><path d="M924,155 L952,155" fill="none" stroke="#24405F" stroke-width="2" marker-end="url(#a)"/><rect x="952" y="90" width="200" height="130" rx="12" fill="#FFB547" stroke="#B87A24" stroke-width="2"/><text x="1052.0" y="138.0" font-size="19" font-weight="600" fill="#0B1626" text-anchor="middle">Gallery panel</text><text x="1052.0" y="166.0" font-size="15" font-weight="400" fill="#24405F" text-anchor="middle">point at an object in</text><text x="1052.0" y="186.0" font-size="15" font-weight="400" fill="#24405F" text-anchor="middle">the photo</text><rect x="40" y="280" width="1120" height="70" rx="12" fill="#E3F1FB" stroke="#4A8DB8" stroke-width="2"/><text x="600" y="322" font-size="17" font-weight="600" fill="#0B1626" text-anchor="middle">Gallery focus overrides dwell: pointing in a photo works like gazing at the object</text></svg>