<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Diagram: the facilitator&#x27;s webcam feeds MediaPipe face landmarks; AvatarDirector blends them onto the Facilitator Virtual Character&#x27;s face in Human mode, or plays animation only in AI mode, fading the face weight between the two." font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title>Diagram: the facilitator&#x27;s webcam feeds MediaPipe face landmarks; AvatarDirector blends them onto the Facilitator Virtual Character&#x27;s face in Human mode, or plays animation only in AI mode, fading the face weight between the two.</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#24405F"/></marker><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B87A24"/></marker></defs><rect width="1200" height="440" fill="#FFFFFF"/><rect x="40" y="160" width="170" height="110" rx="12" fill="#FFFFFF" stroke="#24405F" stroke-width="2"/><text x="125.0" y="198.0" font-size="19" font-weight="600" fill="#0B1626" text-anchor="middle">Webcam</text><text x="125.0" y="226.0" font-size="15" font-weight="400" fill="#4A6480" text-anchor="middle">facilitator's</text><text x="125.0" y="246.0" font-size="15" font-weight="400" fill="#4A6480" text-anchor="middle">face</text><path d="M210,215 L260,215" fill="none" stroke="#24405F" stroke-width="2" marker-end="url(#a)"/><rect x="260" y="110" width="230" height="210" rx="12" fill="#FFFFFF" stroke="#24405F" stroke-width="2"/><ellipse cx="375" cy="200" rx="58" ry="74" fill="#E3F1FB" stroke="#4A8DB8" stroke-width="2"/><circle cx="352" cy="180" r="4" fill="#FFB547" stroke="#B87A24" stroke-width="1"/><circle cx="398" cy="180" r="4" fill="#FFB547" stroke="#B87A24" stroke-width="1"/><circle cx="375" cy="205" r="4" fill="#FFB547" stroke="#B87A24" stroke-width="1"/><circle cx="355" cy="232" r="4" fill="#FFB547" stroke="#B87A24" stroke-width="1"/><circle cx="375" cy="238" r="4" fill="#FFB547" stroke="#B87A24" stroke-width="1"/><circle cx="395" cy="232" r="4" fill="#FFB547" stroke="#B87A24" stroke-width="1"/><circle cx="340" cy="160" r="4" fill="#FFB547" stroke="#B87A24" stroke-width="1"/><circle cx="410" cy="160" r="4" fill="#FFB547" stroke="#B87A24" stroke-width="1"/><circle cx="375" cy="150" r="4" fill="#FFB547" stroke="#B87A24" stroke-width="1"/><text x="375" y="302" font-size="15" font-weight="600" fill="#0B1626" text-anchor="middle">MediaPipe face landmarks</text><path d="M490,215 L540,215" fill="none" stroke="#24405F" stroke-width="2" marker-end="url(#a)"/><rect x="540" y="120" width="300" height="190" rx="12" fill="#FFB547" stroke="#B87A24" stroke-width="2"/><text x="690.0" y="178.0" font-size="19" font-weight="600" fill="#0B1626" text-anchor="middle">AvatarDirector</text><text x="690.0" y="206.0" font-size="15" font-weight="400" fill="#24405F" text-anchor="middle">Human mode: a performer drives</text><text x="690.0" y="226.0" font-size="15" font-weight="400" fill="#24405F" text-anchor="middle">the face. AI mode: animation</text><text x="690.0" y="246.0" font-size="15" font-weight="400" fill="#24405F" text-anchor="middle">only. The face weight fades, it</text><text x="690.0" y="266.0" font-size="15" font-weight="400" fill="#24405F" text-anchor="middle">does not cut.</text><path d="M840,215 L890,215" fill="none" stroke="#24405F" stroke-width="2" marker-end="url(#a)"/><rect x="890" y="110" width="270" height="210" rx="12" fill="#E3F1FB" stroke="#4A8DB8" stroke-width="2"/><path d="M991.0,300 L991.0,211.6 Q991.0,181.0 1025,181.0 Q1059.0,181.0 1059.0,211.6 L1059.0,300 Z" fill="#4A8DB8"/><circle cx="1025" cy="152.1" r="22.1" fill="#4A8DB8"/><circle cx="1025" cy="152.1" r="13.702" fill="#B5DEF7"/><text x="1025" y="350" font-size="15" font-weight="600" fill="#0B1626" text-anchor="middle">Facilitator Virtual Character</text></svg>