<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Diagram seen from above: the participant&#x27;s gaze cone covers several items; one controller ray passes the gates and lands on the highlighted target, which shows its score, while the other controller&#x27;s ray is rejected as resting." font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title>Diagram seen from above: the participant&#x27;s gaze cone covers several items; one controller ray passes the gates and lands on the highlighted target, which shows its score, while the other controller&#x27;s ray is rejected as resting.</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#24405F"/></marker><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B87A24"/></marker></defs><rect width="1200" height="520" fill="#FFFFFF"/><rect x="40" y="40" width="1120" height="440" rx="20" fill="#E3F1FB" stroke="#C4D9EA" stroke-width="2"/><text x="70" y="80" font-size="16" font-weight="600" fill="#4A6480" text-anchor="start">Seen from above</text><path d="M220,340 L860,110 L900,330 L220,340" fill="#B5DEF7" stroke="#4A8DB8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="0.55"/><text x="520" y="215" font-size="15" font-weight="600" fill="#0B1626" text-anchor="middle">Gaze cone</text><circle cx="220" cy="340" r="30" fill="#0B1626"/><text x="220" y="400" font-size="15" font-weight="600" fill="#0B1626" text-anchor="middle">Participant</text><circle cx="180" cy="332" r="9" fill="#4A6480"/><circle cx="260" cy="350" r="9" fill="#4A6480"/><path d="M266,346 L838,232" fill="none" stroke="#B87A24" stroke-width="2" marker-end="url(#ah)"/><text x="600" y="400" font-size="15" font-weight="600" fill="#0B1626" text-anchor="middle">Solid ray: this controller passes the gates</text><path d="M176,340 L100,410" fill="none" stroke="#4A6480" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/><text x="160" y="436" font-size="14" font-weight="600" fill="#4A6480" text-anchor="middle">Rejected: 'resting'</text><rect x="880" y="90" width="120" height="70" rx="10" fill="#FFFFFF" stroke="#24405F" stroke-width="2"/><text x="940" y="132" font-size="15" font-weight="600" fill="#0B1626" text-anchor="middle">Item</text><rect x="850" y="190" width="120" height="70" rx="10" fill="#FFFFFF" stroke="#B87A24" stroke-width="4"/><text x="910" y="232" font-size="15" font-weight="600" fill="#0B1626" text-anchor="middle">Target</text><rect x="930" y="330" width="120" height="70" rx="10" fill="#FFFFFF" stroke="#24405F" stroke-width="2"/><text x="990" y="372" font-size="15" font-weight="600" fill="#0B1626" text-anchor="middle">Item</text><rect x="984" y="205" width="80" height="30" rx="15" fill="#FFB547" stroke="#B87A24" stroke-width="1.5"/><text x="1024" y="225" font-size="14" font-weight="700" fill="#0B1626" text-anchor="middle">score</text></svg>