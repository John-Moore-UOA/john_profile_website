<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Diagram of the three study body modes: separate embodied, with both characters standing in the kitchen; detached voice, where the EVC is heard only; and combined, one EVC body with the facilitator&#x27;s expression on its face." font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title>Diagram of the three study body modes: separate embodied, with both characters standing in the kitchen; detached voice, where the EVC is heard only; and combined, one EVC body with the facilitator&#x27;s expression on its face.</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#24405F"/></marker><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B87A24"/></marker></defs><rect width="1200" height="480" fill="#FFFFFF"/><rect x="40" y="40" width="360" height="400" rx="16" fill="#E3F1FB" stroke="#C4D9EA" stroke-width="2"/><path d="M112.0,300 L112.0,201.2 Q112.0,166.99999999999997 150,166.99999999999997 Q188.0,166.99999999999997 188.0,201.2 L188.0,300 Z" fill="#0B1626"/><circle cx="150" cy="134.7" r="24.7" fill="#0B1626"/><path d="M252.0,300 L252.0,201.2 Q252.0,166.99999999999997 290,166.99999999999997 Q328.0,166.99999999999997 328.0,201.2 L328.0,300 Z" fill="#4A8DB8"/><circle cx="290" cy="134.7" r="24.7" fill="#4A8DB8"/><text x="150" y="326" font-size="14" font-weight="600" fill="#0B1626" text-anchor="middle">EVC</text><text x="290" y="326" font-size="14" font-weight="600" fill="#0B1626" text-anchor="middle">Facilitator</text><text x="220" y="372" font-size="19" font-weight="650" fill="#0B1626" text-anchor="middle">Separate embodied</text><text x="220" y="396" font-size="14" font-weight="500" fill="#4A6480" text-anchor="middle">Both characters stand in the kitchen</text><rect x="420" y="40" width="360" height="400" rx="16" fill="#E3F1FB" stroke="#C4D9EA" stroke-width="2"/><circle cx="600" cy="210" r="26" fill="#0B1626"/><circle cx="600" cy="210" r="48" fill="none" stroke="#4A8DB8" stroke-width="3" opacity="0.66"/><circle cx="600" cy="210" r="72" fill="none" stroke="#4A8DB8" stroke-width="3" opacity="0.45"/><circle cx="600" cy="210" r="96" fill="none" stroke="#4A8DB8" stroke-width="3" opacity="0.23"/><text x="600" y="326" font-size="14" font-weight="600" fill="#0B1626" text-anchor="middle">EVC voice</text><text x="600" y="372" font-size="19" font-weight="650" fill="#0B1626" text-anchor="middle">Detached voice</text><text x="600" y="396" font-size="14" font-weight="500" fill="#4A6480" text-anchor="middle">The EVC is heard only: no gaze, gesture or</text><text x="600" y="415" font-size="14" font-weight="500" fill="#4A6480" text-anchor="middle">face</text><rect x="800" y="40" width="360" height="400" rx="16" fill="#E3F1FB" stroke="#C4D9EA" stroke-width="2"/><path d="M942.0,300 L942.0,201.2 Q942.0,166.99999999999997 980,166.99999999999997 Q1018.0,166.99999999999997 1018.0,201.2 L1018.0,300 Z" fill="#0B1626"/><circle cx="980" cy="134.7" r="24.7" fill="#0B1626"/><circle cx="980" cy="134.7" r="15.314" fill="#4A8DB8"/><text x="980" y="326" font-size="14" font-weight="600" fill="#0B1626" text-anchor="middle">EVC body, facilitator face</text><text x="980" y="372" font-size="19" font-weight="650" fill="#0B1626" text-anchor="middle">Combined</text><text x="980" y="396" font-size="14" font-weight="500" fill="#4A6480" text-anchor="middle">One body: the EVC, with the facilitator's</text><text x="980" y="415" font-size="14" font-weight="500" fill="#4A6480" text-anchor="middle">expression on its face</text></svg>