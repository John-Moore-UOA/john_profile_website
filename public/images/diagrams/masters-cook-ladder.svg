<svg xmlns="http://www.w3.org/2000/svg" viewBox="36 40 1148 220" width="1148" height="220" role="img" aria-label="Timed cooking cue ladder along a timeline: suggestion, then direction, then a done window, then auto-off. Each rung only fires if the participant has not yet acted." font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title>Timed cooking cue ladder along a timeline: suggestion, then direction, then a done window, then auto-off. Each rung only fires if the participant has not yet acted.</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#24405F"/></marker><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B87A24"/></marker></defs><rect x="36" y="40" width="1148" height="220" fill="#FFFFFF"/><path d="M236.5,90.0 L261.8,90.0 Q271.8,90.0 281.8,90.0 L307.0,90.0" fill="none" stroke="#24405F" stroke-width="2" marker-end="url(#a)"/><path d="M458.0,90.0 L490.2,90.0 Q500.2,90.0 510.2,90.0 L542.5,90.0" fill="none" stroke="#24405F" stroke-width="2" marker-end="url(#a)"/><path d="M692.5,90.0 L722.5,90.0 Q732.5,90.0 742.5,90.0 L772.5,90.0" fill="none" stroke="#24405F" stroke-width="2" marker-end="url(#a)"/><path d="M932.5,90.0 L962.5,90.0 Q972.5,90.0 982.5,90.0 L1012.5,90.0" fill="none" stroke="#24405F" stroke-width="2" marker-end="url(#a)"/><rect x="58.5" y="62.0" width="178" height="56" rx="11" fill="#B5DEF7" stroke="#1B5A87" stroke-width="2"/><text x="147.5" y="96.0" text-anchor="middle" font-size="16" font-weight="650" fill="#0B1626">Cook step starts</text><rect x="307.0" y="62.0" width="151" height="56" rx="11" fill="#FFFFFF" stroke="#24405F" stroke-width="2"/><text x="382.5" y="96.0" text-anchor="middle" font-size="16" font-weight="650" fill="#0B1626">1. Suggestion</text><rect x="542.5" y="62.0" width="150" height="56" rx="11" fill="#FFFFFF" stroke="#24405F" stroke-width="2"/><text x="617.5" y="96.0" text-anchor="middle" font-size="16" font-weight="650" fill="#0B1626">2. Direction</text><rect x="772.5" y="62.0" width="160" height="56" rx="11" fill="#FFB547" stroke="#B87A24" stroke-width="2"/><text x="852.5" y="96.0" text-anchor="middle" font-size="16" font-weight="650" fill="#0B1626">3. Done window</text><rect x="1012.5" y="62.0" width="150" height="56" rx="11" fill="#0B1626" stroke="#0B1626" stroke-width="2"/><text x="1087.5" y="96.0" text-anchor="middle" font-size="16" font-weight="650" fill="#F4FAFF">4. Auto-off</text><rect x="122.5" y="182.0" width="520" height="56" rx="11" fill="none" stroke="#4A8DB8" stroke-width="1.5" stroke-dasharray="6 5"/><text x="382.5" y="216.0" text-anchor="middle" font-size="16" font-weight="650" fill="#24405F">Each rung only fires if the participant has not acted yet</text><text x="712.5" y="81.0" text-anchor="middle" font-size="14" font-weight="500" fill="#24405F" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" paint-order="stroke">time passes</text></svg>