<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Diagram: in the rule builder a rule&#x27;s THEN can run an action instead of setting an object status; the rule engine sends it to a VCoreAction component in the Unity scene and an action_fired event comes back. A project catalog baked at build time lists every status and action." font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title>Diagram: in the rule builder a rule&#x27;s THEN can run an action instead of setting an object status; the rule engine sends it to a VCoreAction component in the Unity scene and an action_fired event comes back. A project catalog baked at build time lists every status and action.</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#24405F"/></marker><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B87A24"/></marker></defs><rect width="1200" height="480" fill="#FFFFFF"/><rect x="40" y="50" width="470" height="380" rx="14" fill="#FFFFFF" stroke="#24405F" stroke-width="2"/><path d="M41,94 L509,94" stroke="#C4D9EA" stroke-width="2"/><text x="60" y="79" font-size="17" font-weight="650" fill="#0B1626" text-anchor="start">Rule builder</text><text x="64" y="130" font-size="15" font-weight="700" fill="#4A6480" text-anchor="start">WHEN</text><rect x="64" y="142" width="420" height="50" rx="10" fill="#E3F1FB" stroke="#C4D9EA" stroke-width="1.5"/><text x="82" y="173" font-size="16" font-weight="500" fill="#0B1626" text-anchor="start">a signal condition holds</text><text x="64" y="232" font-size="15" font-weight="700" fill="#4A6480" text-anchor="start">THEN</text><rect x="64" y="244" width="420" height="50" rx="10" fill="#FFFFFF" stroke="#C4D9EA" stroke-width="1.5" stroke-dasharray="6 5"/><text x="82" y="275" font-size="16" font-weight="500" fill="#4A6480" text-anchor="start">set an object status</text><rect x="64" y="306" width="420" height="50" rx="10" fill="#FFB547" stroke="#B87A24" stroke-width="2"/><text x="82" y="337" font-size="16" font-weight="650" fill="#0B1626" text-anchor="start">run an action</text><text x="64" y="400" font-size="14" font-weight="500" fill="#4A6480" text-anchor="start">Statuses and actions come from the project catalog</text><path d="M510,331 L590,240" fill="none" stroke="#B87A24" stroke-width="2" marker-end="url(#ah)"/><rect x="590" y="180" width="230" height="110" rx="12" fill="#FFFFFF" stroke="#24405F" stroke-width="2"/><text x="705.0" y="228.0" font-size="19" font-weight="600" fill="#0B1626" text-anchor="middle">Rule engine</text><text x="705.0" y="256.0" font-size="15" font-weight="400" fill="#4A6480" text-anchor="middle">then.action</text><path d="M820,235 L900,235" fill="none" stroke="#24405F" stroke-width="2" marker-end="url(#a)"/><rect x="900" y="180" width="260" height="110" rx="12" fill="#0B1626" stroke="#0B1626" stroke-width="2"/><text x="1030.0" y="228.0" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="middle">VCoreAction</text><text x="1030.0" y="256.0" font-size="15" font-weight="400" fill="#B5DEF7" text-anchor="middle">component in the Unity scene</text><path d="M1030,290 L1030,380 L705,380" fill="none" stroke="#24405F" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5"/><path d="M705,380 L705,292" fill="none" stroke="#24405F" stroke-width="2" marker-end="url(#a)"/><text x="868" y="404" font-size="14" font-weight="500" fill="#4A6480" text-anchor="middle">action_fired event</text><rect x="590" y="50" width="570" height="80" rx="12" fill="#E3F1FB" stroke="#4A8DB8" stroke-width="2"/><text x="875.0" y="83.0" font-size="19" font-weight="600" fill="#0B1626" text-anchor="middle">Project catalog</text><text x="875.0" y="111.0" font-size="15" font-weight="400" fill="#24405F" text-anchor="middle">every ObjectStatus and VCoreAction, baked at build time</text></svg>