<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Diagram: a slow-loop request passes through the SlowModelSwitch, which routes it either to a local vLLM model in Docker (starting or stopping the container) or to Gemini on Vertex in the cloud, with a cached access token and a 20 second floor between requests." font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title>Diagram: a slow-loop request passes through the SlowModelSwitch, which routes it either to a local vLLM model in Docker (starting or stopping the container) or to Gemini on Vertex in the cloud, with a cached access token and a 20 second floor between requests.</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#24405F"/></marker><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B87A24"/></marker></defs><rect width="1200" height="440" fill="#FFFFFF"/><rect x="40" y="170" width="220" height="100" rx="12" fill="#FFFFFF" stroke="#24405F" stroke-width="2"/><text x="150.0" y="226.0" font-size="19" font-weight="600" fill="#0B1626" text-anchor="middle">Slow loop request</text><path d="M260,220 L330,220" fill="none" stroke="#24405F" stroke-width="2" marker-end="url(#a)"/><rect x="330" y="150" width="250" height="140" rx="12" fill="#FFB547" stroke="#B87A24" stroke-width="2"/><text x="455.0" y="213.0" font-size="19" font-weight="600" fill="#0B1626" text-anchor="middle">SlowModelSwitch</text><text x="455.0" y="241.0" font-size="15" font-weight="400" fill="#24405F" text-anchor="middle">Local or Cloud</text><path d="M580,195 L700,115" fill="none" stroke="#24405F" stroke-width="2" marker-end="url(#a)"/><text x="640.0" y="145.0" font-size="14" font-weight="500" fill="#4A6480" text-anchor="middle">Local</text><path d="M580,245 L700,325" fill="none" stroke="#24405F" stroke-width="2" marker-end="url(#a)"/><text x="640.0" y="307.0" font-size="14" font-weight="500" fill="#4A6480" text-anchor="middle">Cloud</text><rect x="700" y="50" width="460" height="130" rx="12" fill="#FFFFFF" stroke="#24405F" stroke-width="2"/><text x="930.0" y="108.0" font-size="19" font-weight="600" fill="#0B1626" text-anchor="middle">vLLM in Docker</text><text x="930.0" y="136.0" font-size="15" font-weight="400" fill="#4A6480" text-anchor="middle">The switch starts or stops the container</text><rect x="700" y="260" width="460" height="130" rx="12" fill="#FFFFFF" stroke="#24405F" stroke-width="2"/><text x="930.0" y="308.0" font-size="19" font-weight="600" fill="#0B1626" text-anchor="middle">Gemini on Vertex</text><text x="930.0" y="336.0" font-size="15" font-weight="400" fill="#4A6480" text-anchor="middle">Cached access token, 20 s floor between cloud</text><text x="930.0" y="356.0" font-size="15" font-weight="400" fill="#4A6480" text-anchor="middle">requests</text></svg>