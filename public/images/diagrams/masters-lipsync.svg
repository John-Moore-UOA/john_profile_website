<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="Diagram of lip sync tuning: the speech audio level is compared against a Shut Level and an Open Level; EvcLipSync, with its Gain and Jaw Open Angle settings, closes the mouth below the shut level and opens the jaw above the open level." font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title>Diagram of lip sync tuning: the speech audio level is compared against a Shut Level and an Open Level; EvcLipSync, with its Gain and Jaw Open Angle settings, closes the mouth below the shut level and opens the jaw above the open level.</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#24405F"/></marker><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B87A24"/></marker></defs><rect width="1200" height="460" fill="#FFFFFF"/><rect x="40" y="50" width="560" height="360" rx="14" fill="#FFFFFF" stroke="#24405F" stroke-width="2"/><path d="M41,94 L599,94" stroke="#C4D9EA" stroke-width="2"/><text x="60" y="79" font-size="17" font-weight="650" fill="#0B1626" text-anchor="start">Speech audio level</text><path d="M70,300.0 L80,253.7 L90,210.6 L100,176.2 L110,155.3 L120,150.5 L130,162.6 L140,190.1 L150,229.4 L160,275.4 L170,277.8 L180,235.9 L190,203.7 L200,184.5 L210,179.8 L220,188.9 L230,209.2 L240,237.3 L250,268.6 L260,298.9 L270,275.5 L280,257.1 L290,247.0 L300,245.0 L310,249.9 L320,259.5 L330,271.5 L340,283.9 L350,294.8 L360,296.5 L370,290.5 L380,287.0 L390,285.3 L400,284.9 L410,285.4 L420,286.7 L430,289.2 L440,293.3 L450,299.4 L460,292.2 L470,282.0 L480,271.0 L490,260.6 L500,253.0 L510,250.3 L520,254.3 L530,266.0 L540,285.3 L550,289.2 L560,260.0 L570,230.9" fill="none" stroke="#0B1626" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M60,175 L580,175" fill="none" stroke="#B87A24" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 6"/><text x="70" y="166" font-size="14" font-weight="600" fill="#B87A24" text-anchor="start">Open Level</text><path d="M60,285 L580,285" fill="none" stroke="#4A8DB8" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 6"/><text x="70" y="276" font-size="14" font-weight="600" fill="#4A8DB8" text-anchor="start">Shut Level</text><path d="M600,230 L660,230" fill="none" stroke="#24405F" stroke-width="2" marker-end="url(#a)"/><rect x="660" y="150" width="220" height="160" rx="12" fill="#FFB547" stroke="#B87A24" stroke-width="2"/><text x="770.0" y="213.0" font-size="19" font-weight="600" fill="#0B1626" text-anchor="middle">EvcLipSync</text><text x="770.0" y="241.0" font-size="15" font-weight="400" fill="#24405F" text-anchor="middle">Shut Level, Open Level,</text><text x="770.0" y="261.0" font-size="15" font-weight="400" fill="#24405F" text-anchor="middle">Gain, Jaw Open Angle</text><path d="M880,230 L940,230" fill="none" stroke="#24405F" stroke-width="2" marker-end="url(#a)"/><rect x="940" y="60" width="220" height="150" rx="12" fill="#E3F1FB" stroke="#C4D9EA" stroke-width="2"/><path d="M1000,135 L1100,135" fill="none" stroke="#0B1626" stroke-width="6" stroke-linecap="round"/><text x="1050" y="190" font-size="14" font-weight="600" fill="#0B1626" text-anchor="middle">Below Shut Level: closed</text><rect x="940" y="250" width="220" height="150" rx="12" fill="#E3F1FB" stroke="#C4D9EA" stroke-width="2"/><ellipse cx="1050" cy="318" rx="46" ry="30" fill="#0B1626"/><text x="1050" y="382" font-size="14" font-weight="600" fill="#0B1626" text-anchor="middle">Above Open Level: jaw open</text></svg>