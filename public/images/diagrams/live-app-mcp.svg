<svg xmlns="http://www.w3.org/2000/svg" viewBox="213 42 1436 248" width="1436" height="248" role="img" aria-label="Live App MCP architecture: Claude Code talks MCP over stdio to app_mcp.py, which talks HTTP to the app server (state GET/PUT with base_rev, /api/rev, /api/view). The browser UI polls /api/rev every 1.5 seconds and posts /api/view." font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title>Live App MCP architecture: Claude Code talks MCP over stdio to app_mcp.py, which talks HTTP to the app server (state GET/PUT with base_rev, /api/rev, /api/view). The browser UI polls /api/rev every 1.5 seconds and posts /api/view.</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#24405F"/></marker><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B87A24"/></marker></defs><rect x="213" y="42" width="1436" height="248" fill="#FFFFFF"/><path d="M385.0,100.0 L580.0,100.0 Q590.0,100.0 600.0,100.0 L795.0,100.0" fill="none" stroke="#24405F" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/><path d="M945.0,100.0 L1124.8,100.0 Q1134.8,100.0 1144.8,100.0 L1324.5,100.0" fill="none" stroke="#24405F" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/><path d="M1430.0,212.0 L1430.0,184.2 Q1430.0,174.2 1430.0,164.2 L1430.0,136.5" fill="none" stroke="#B87A24" stroke-width="2" marker-end="url(#ah)" marker-start="url(#ah)"/><rect x="235.0" y="72.0" width="150" height="56" rx="11" fill="#B5DEF7" stroke="#1B5A87" stroke-width="2"/><text x="310.0" y="106.0" text-anchor="middle" font-size="16" font-weight="650" fill="#0B1626">Claude Code</text><rect x="795.0" y="63.5" width="150" height="73" rx="11" fill="#0B1626" stroke="#0B1626" stroke-width="2"/><text x="870.0" y="94.5" text-anchor="middle" font-size="16" font-weight="650" fill="#F4FAFF">app_mcp.py</text><text x="870.0" y="115.5" text-anchor="middle" font-size="14" fill="#B5DEF7">MCP server</text><rect x="1324.5" y="63.5" width="211" height="73" rx="11" fill="#FFFFFF" stroke="#24405F" stroke-width="2"/><text x="1430.0" y="94.5" text-anchor="middle" font-size="16" font-weight="650" fill="#0B1626">App server</text><text x="1430.0" y="115.5" text-anchor="middle" font-size="14" fill="#4A6480">state file/DB, long jobs</text><rect x="1355.0" y="212.0" width="150" height="56" rx="11" fill="#FFB547" stroke="#B87A24" stroke-width="2"/><text x="1430.0" y="246.0" text-anchor="middle" font-size="16" font-weight="650" fill="#0B1626">Browser UI</text><text x="487.5" y="91.0" text-anchor="middle" font-size="14" font-weight="500" fill="#24405F" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" paint-order="stroke">MCP over stdio</text><text x="1039.9" y="74.0" text-anchor="middle" font-size="14" font-weight="500" fill="#24405F" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" paint-order="stroke">HTTP /api/rev, /api/view</text><text x="1039.9" y="91.0" text-anchor="middle" font-size="14" font-weight="500" fill="#24405F" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" paint-order="stroke">state GET/PUT with base_rev</text><text x="1440.0" y="190.1" text-anchor="start" font-size="14" font-weight="500" fill="#24405F" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" paint-order="stroke">polls /api/rev every 1.5 s</text><text x="1440.0" y="207.1" text-anchor="start" font-size="14" font-weight="500" fill="#24405F" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" paint-order="stroke">POSTs /api/view</text></svg>