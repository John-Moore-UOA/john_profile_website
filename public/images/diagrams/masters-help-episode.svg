<svg xmlns="http://www.w3.org/2000/svg" viewBox="-7 27 1538 386" width="1538" height="386" role="img" aria-label="State machine of a Think-it-through help episode: a gate, a yes/no judge, an open line, a question, the answer judged in code, then right (confirm and end), wrong (retry), or out of tries (fallback and end)." font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title>State machine of a Think-it-through help episode: a gate, a yes/no judge, an open line, a question, the answer judged in code, then right (confirm and end), wrong (retry), or out of tries (fallback and end).</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#24405F"/></marker><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B87A24"/></marker></defs><rect x="-7" y="27" width="1538" height="386" fill="#FFFFFF"/><path d="M345.0,95.0 L348.6,95.0 Q352.2,95.0 355.9,95.0 L359.5,95.0" fill="none" stroke="#24405F" stroke-width="2" marker-end="url(#a)"/><path d="M600.5,95.0 L627.5,95.0 Q637.5,95.0 647.5,95.0 L674.5,95.0" fill="none" stroke="#24405F" stroke-width="2" marker-end="url(#a)"/><path d="M885.5,95.0 L920.0,95.0 Q930.0,95.0 940.0,95.0 L974.5,95.0" fill="none" stroke="#24405F" stroke-width="2" marker-end="url(#a)"/><path d="M1080.0,141.0 L1080.0,159.0 Q1080.0,169.0 1080.0,179.0 L1080.0,197.0" fill="none" stroke="#24405F" stroke-width="2" marker-end="url(#a)"/><path d="M968.5,225.0 L921.8,225.0 Q911.8,225.0 901.8,225.0 L855.0,225.0" fill="none" stroke="#24405F" stroke-width="2" marker-end="url(#a)"/><path d="M1191.5,225.0 L1211.0,225.0 Q1221.0,225.0 1231.0,225.0 L1250.5,225.0" fill="none" stroke="#24405F" stroke-width="2" marker-end="url(#a)"/><path d="M1080.0,253.0 L1080.0,275.8 Q1080.0,285.8 1080.0,295.8 L1080.0,318.5" fill="none" stroke="#24405F" stroke-width="2" marker-end="url(#a)"/><path d="M1173.5,355.0 L1224.2,355.0 Q1234.2,355.0 1244.2,355.0 L1295.0,355.0" fill="none" stroke="#24405F" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/><rect x="15.0" y="49.0" width="330" height="92" rx="11" fill="#FFFFFF" stroke="#24405F" stroke-width="2"/><text x="180.0" y="80.0" text-anchor="middle" font-size="16" font-weight="650" fill="#0B1626">Gate</text><text x="180.0" y="101.0" text-anchor="middle" font-size="14" fill="#4A6480">AI on · no progress 10 s · quiet 3 s</text><text x="180.0" y="120.0" text-anchor="middle" font-size="14" fill="#4A6480">20 s since last help · focus line has strategy</text><rect x="359.5" y="58.5" width="241" height="73" rx="11" fill="#FFFFFF" stroke="#24405F" stroke-width="2"/><text x="480.0" y="89.5" text-anchor="middle" font-size="16" font-weight="650" fill="#0B1626">Fast-model yes/no judge</text><text x="480.0" y="110.5" text-anchor="middle" font-size="14" fill="#4A6480">on a feature card</text><rect x="674.5" y="58.5" width="211" height="73" rx="11" fill="#FFB547" stroke="#B87A24" stroke-width="2"/><text x="780.0" y="89.5" text-anchor="middle" font-size="16" font-weight="650" fill="#0B1626">OPEN</text><text x="780.0" y="110.5" text-anchor="middle" font-size="14" fill="#13233A">&quot;Let&#x27;s think it through&quot;</text><rect x="974.5" y="49.0" width="211" height="92" rx="11" fill="#FFB547" stroke="#B87A24" stroke-width="2"/><text x="1080.0" y="80.0" text-anchor="middle" font-size="16" font-weight="650" fill="#0B1626">ASK</text><text x="1080.0" y="101.0" text-anchor="middle" font-size="14" fill="#13233A">&quot;Where would you usually</text><text x="1080.0" y="120.0" text-anchor="middle" font-size="14" fill="#13233A">keep the item?&quot;</text><rect x="968.5" y="197.0" width="223" height="56" rx="11" fill="#0B1626" stroke="#0B1626" stroke-width="2"/><text x="1080.0" y="231.0" text-anchor="middle" font-size="16" font-weight="650" fill="#F4FAFF">Answer judged in code</text><rect x="705.0" y="188.5" width="150" height="73" rx="11" fill="#B5DEF7" stroke="#1B5A87" stroke-width="2"/><text x="780.0" y="219.5" text-anchor="middle" font-size="16" font-weight="650" fill="#0B1626">Right</text><text x="780.0" y="240.5" text-anchor="middle" font-size="14" fill="#13233A">confirm and end</text><rect x="1250.5" y="188.5" width="259" height="73" rx="11" fill="#FFFFFF" stroke="#24405F" stroke-width="2"/><text x="1380.0" y="219.5" text-anchor="middle" font-size="16" font-weight="650" fill="#0B1626">Out of tries / don&#x27;t know</text><text x="1380.0" y="240.5" text-anchor="middle" font-size="14" fill="#4A6480">fallback line, then end</text><rect x="986.5" y="318.5" width="187" height="73" rx="11" fill="#FFFFFF" stroke="#24405F" stroke-width="2"/><text x="1080.0" y="349.5" text-anchor="middle" font-size="16" font-weight="650" fill="#0B1626">Wrong, tries left</text><text x="1080.0" y="370.5" text-anchor="middle" font-size="14" fill="#4A6480">retry with a hint</text><rect x="1295.0" y="327.0" width="170" height="56" rx="11" fill="none" stroke="#4A8DB8" stroke-width="1.5" stroke-dasharray="6 5"/><text x="1380.0" y="361.0" text-anchor="middle" font-size="16" font-weight="650" fill="#24405F">back to ASK</text><text x="619.0" y="86.0" text-anchor="middle" font-size="14" font-weight="500" fill="#24405F" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" paint-order="stroke">yes</text></svg>