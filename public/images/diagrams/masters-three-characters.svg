<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="Diagram of the three characters side by side: the AI-driven Empathic Virtual Character, the Facilitator Virtual Character whose face is performed through webcam mocap, and the participant&#x27;s own avatar with a swappable head." font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title>Diagram of the three characters side by side: the AI-driven Empathic Virtual Character, the Facilitator Virtual Character whose face is performed through webcam mocap, and the participant&#x27;s own avatar with a swappable head.</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#24405F"/></marker><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B87A24"/></marker></defs><rect width="1200" height="500" fill="#FFFFFF"/><path d="M168.0,360 L168.0,224.80000000000004 Q168.0,178.00000000000003 220,178.00000000000003 Q272.0,178.00000000000003 272.0,224.80000000000004 L272.0,360 Z" fill="#0B1626"/><circle cx="220" cy="133.8" r="33.800000000000004" fill="#0B1626"/><text x="220" y="388" font-size="18" font-weight="600" fill="#0B1626" text-anchor="middle">Empathic Virtual Character</text><text x="220" y="410" font-size="15" font-weight="400" fill="#4A6480" text-anchor="middle">AI-driven: talks, listens,</text><text x="220" y="430" font-size="15" font-weight="400" fill="#4A6480" text-anchor="middle">looks, points</text><path d="M548.0,360 L548.0,224.80000000000004 Q548.0,178.00000000000003 600,178.00000000000003 Q652.0,178.00000000000003 652.0,224.80000000000004 L652.0,360 Z" fill="#4A8DB8"/><circle cx="600" cy="133.8" r="33.800000000000004" fill="#4A8DB8"/><text x="600" y="388" font-size="18" font-weight="600" fill="#0B1626" text-anchor="middle">Facilitator Virtual Character</text><text x="600" y="410" font-size="15" font-weight="400" fill="#4A6480" text-anchor="middle">Face performed by the</text><text x="600" y="430" font-size="15" font-weight="400" fill="#4A6480" text-anchor="middle">facilitator through webcam</text><text x="600" y="450" font-size="15" font-weight="400" fill="#4A6480" text-anchor="middle">mocap</text><path d="M928.0,360 L928.0,224.80000000000004 Q928.0,178.00000000000003 980,178.00000000000003 Q1032.0,178.00000000000003 1032.0,224.80000000000004 L1032.0,360 Z" fill="#4A6480"/><circle cx="980" cy="133.8" r="33.800000000000004" fill="#4A6480"/><rect x="941.13" y="118.59" width="77.74000000000001" height="30.420000000000005" rx="8.450000000000001" fill="#0B1626" stroke="#7EC8F2" stroke-width="2"/><text x="980" y="388" font-size="18" font-weight="600" fill="#0B1626" text-anchor="middle">Participant avatar</text><text x="980" y="410" font-size="15" font-weight="400" fill="#4A6480" text-anchor="middle">Body follows the participant;</text><text x="980" y="430" font-size="15" font-weight="400" fill="#4A6480" text-anchor="middle">head swapped to match them</text></svg>