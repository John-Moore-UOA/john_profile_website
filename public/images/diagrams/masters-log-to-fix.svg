<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="Diagram: a turn in the EVC session log where the model got it wrong is read back, and the fix moves that kind of question (can you hear me, how do I, is this it, questions about the session) to an answer built in code." font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title>Diagram: a turn in the EVC session log where the model got it wrong is read back, and the fix moves that kind of question (can you hear me, how do I, is this it, questions about the session) to an answer built in code.</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#24405F"/></marker><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B87A24"/></marker></defs><rect width="1200" height="460" fill="#FFFFFF"/><rect x="40" y="50" width="400" height="360" rx="14" fill="#FFFFFF" stroke="#24405F" stroke-width="2"/><path d="M41,94 L439,94" stroke="#C4D9EA" stroke-width="2"/><text x="60" y="79" font-size="17" font-weight="650" fill="#0B1626" text-anchor="start">EVC session log</text><rect x="60" y="115" width="360" height="34" rx="8" fill="#E3F1FB"/><text x="76" y="137" font-size="15" font-weight="500" fill="#0B1626" text-anchor="start">Turn 1</text><rect x="60" y="161" width="360" height="34" rx="8" fill="#E3F1FB"/><text x="76" y="183" font-size="15" font-weight="500" fill="#0B1626" text-anchor="start">Turn 2</text><rect x="60" y="207" width="360" height="34" rx="8" fill="#E3F1FB"/><text x="76" y="229" font-size="15" font-weight="500" fill="#0B1626" text-anchor="start">Turn 3</text><rect x="60" y="253" width="360" height="34" rx="8" fill="#FFB547" stroke="#B87A24" stroke-width="2"/><text x="76" y="275" font-size="15" font-weight="600" fill="#0B1626" text-anchor="start">Turn the model got wrong</text><rect x="60" y="299" width="360" height="34" rx="8" fill="#E3F1FB"/><text x="76" y="321" font-size="15" font-weight="500" fill="#0B1626" text-anchor="start">Turn 5</text><rect x="60" y="345" width="360" height="34" rx="8" fill="#E3F1FB"/><text x="76" y="367" font-size="15" font-weight="500" fill="#0B1626" text-anchor="start">Turn 6</text><path d="M440,247 L500,247" fill="none" stroke="#24405F" stroke-width="2" marker-end="url(#a)"/><rect x="500" y="190" width="220" height="114" rx="12" fill="#FFFFFF" stroke="#24405F" stroke-width="2"/><text x="610.0" y="230.0" font-size="19" font-weight="600" fill="#0B1626" text-anchor="middle">Read the turn</text><text x="610.0" y="258.0" font-size="15" font-weight="400" fill="#4A6480" text-anchor="middle">What was asked, what</text><text x="610.0" y="278.0" font-size="15" font-weight="400" fill="#4A6480" text-anchor="middle">came back</text><path d="M720,247 L780,247" fill="none" stroke="#24405F" stroke-width="2" marker-end="url(#a)"/><rect x="780" y="50" width="380" height="360" rx="14" fill="#FFFFFF" stroke="#24405F" stroke-width="2"/><path d="M781,94 L1159,94" stroke="#C4D9EA" stroke-width="2"/><text x="800" y="79" font-size="17" font-weight="650" fill="#0B1626" text-anchor="start">Fix: the answer is built in code</text><rect x="800" y="115" width="340" height="46" rx="10" fill="#E3F1FB" stroke="#C4D9EA" stroke-width="1.5"/><text x="818" y="144" font-size="16" font-weight="500" fill="#0B1626" text-anchor="start">"Can you hear me?"</text><rect x="800" y="177" width="340" height="46" rx="10" fill="#E3F1FB" stroke="#C4D9EA" stroke-width="1.5"/><text x="818" y="206" font-size="16" font-weight="500" fill="#0B1626" text-anchor="start">"How do I…?"</text><rect x="800" y="239" width="340" height="46" rx="10" fill="#E3F1FB" stroke="#C4D9EA" stroke-width="1.5"/><text x="818" y="268" font-size="16" font-weight="500" fill="#0B1626" text-anchor="start">"Is this it?"</text><rect x="800" y="301" width="340" height="46" rx="10" fill="#E3F1FB" stroke="#C4D9EA" stroke-width="1.5"/><text x="818" y="330" font-size="16" font-weight="500" fill="#0B1626" text-anchor="start">Questions about the session itself</text></svg>