<svg xmlns="http://www.w3.org/2000/svg" viewBox="58 34 945 242" width="945" height="242" role="img" aria-label="Voice-act cache flow: the fast LLM picks an act id, the realiser resolves it to a cached WAV in the Chatterbox sidecar or renders live on a miss, and the session log records the hit rate." font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title>Voice-act cache flow: the fast LLM picks an act id, the realiser resolves it to a cached WAV in the Chatterbox sidecar or renders live on a miss, and the session log records the hit rate.</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#24405F"/></marker><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B87A24"/></marker></defs><rect x="58" y="34" width="945" height="242" fill="#FFFFFF"/><path d="M230.0,92.5 L264.0,92.5 Q274.0,92.5 284.0,92.5 L318.0,92.5" fill="none" stroke="#24405F" stroke-width="2" marker-end="url(#a)"/><path d="M492.0,92.5 L521.8,92.5 Q531.8,92.5 541.8,92.5 L571.5,92.5" fill="none" stroke="#24405F" stroke-width="2" marker-end="url(#a)"/><path d="M492.0,92.5 L645.0,92.5 Q655.0,92.5 655.0,102.5 L655.0,181.0" fill="none" stroke="#24405F" stroke-width="2" marker-end="url(#a)"/><path d="M738.5,92.5 L773.8,92.5 Q783.8,92.5 793.8,92.5 L829.0,92.5" fill="none" stroke="#24405F" stroke-width="2" marker-end="url(#a)"/><path d="M730.0,217.5 L895.0,217.5 Q905.0,217.5 905.0,207.5 L905.0,129.0" fill="none" stroke="#24405F" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/><rect x="80.0" y="56.0" width="150" height="73" rx="11" fill="#FFFFFF" stroke="#24405F" stroke-width="2"/><text x="155.0" y="87.0" text-anchor="middle" font-size="16" font-weight="650" fill="#0B1626">Fast LLM</text><text x="155.0" y="108.0" text-anchor="middle" font-size="14" fill="#4A6480">picks an act id</text><rect x="318.0" y="56.0" width="174" height="73" rx="11" fill="#0B1626" stroke="#0B1626" stroke-width="2"/><text x="405.0" y="87.0" text-anchor="middle" font-size="16" font-weight="650" fill="#F4FAFF">Realiser</text><text x="405.0" y="108.0" text-anchor="middle" font-size="14" fill="#B5DEF7">e.g. find.where egg</text><rect x="571.5" y="56.0" width="167" height="73" rx="11" fill="#FFB547" stroke="#B87A24" stroke-width="2"/><text x="655.0" y="87.0" text-anchor="middle" font-size="16" font-weight="650" fill="#0B1626">Cached WAV</text><text x="655.0" y="108.0" text-anchor="middle" font-size="14" fill="#13233A">Chatterbox sidecar</text><rect x="580.0" y="181.0" width="150" height="73" rx="11" fill="#FFFFFF" stroke="#24405F" stroke-width="2"/><text x="655.0" y="212.0" text-anchor="middle" font-size="16" font-weight="650" fill="#0B1626">Live render</text><text x="655.0" y="233.0" text-anchor="middle" font-size="14" fill="#4A6480">on a miss</text><rect x="829.0" y="56.0" width="152" height="73" rx="11" fill="#FFF4DC" stroke="#B87A24" stroke-width="2"/><text x="905.0" y="87.0" text-anchor="middle" font-size="16" font-weight="650" fill="#0B1626">Session log</text><text x="905.0" y="108.0" text-anchor="middle" font-size="14" fill="#6B4710">records hit rate</text><text x="511.9" y="83.5" text-anchor="middle" font-size="14" font-weight="500" fill="#24405F" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" paint-order="stroke">hit</text><text x="573.5" y="83.5" text-anchor="middle" font-size="14" font-weight="500" fill="#24405F" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" paint-order="stroke">miss</text></svg>