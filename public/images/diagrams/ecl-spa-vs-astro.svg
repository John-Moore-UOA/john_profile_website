<svg xmlns="http://www.w3.org/2000/svg" viewBox="61 22 884 344" width="884" height="344" role="img" aria-label="Before and after. Old React single page app: the browser gets an empty div and a JS bundle, and content appears after the JS runs. New Astro build: the browser gets prerendered HTML for each route, with a small island for copy-link." font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title>Before and after. Old React single page app: the browser gets an empty div and a JS bundle, and content appears after the JS runs. New Astro build: the browser gets prerendered HTML for each route, with a small island for copy-link.</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#24405F"/></marker><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B87A24"/></marker></defs><rect x="61" y="22" width="884" height="344" fill="#FFFFFF"/><rect x="83.0" y="43.5" width="803.5" height="130.0" rx="16" fill="#E3F1FB" fill-opacity=".55" stroke="#4A8DB8" stroke-width="1.5" stroke-dasharray="7 6"/><text x="97.0" y="65.5" font-size="14" font-weight="700" fill="#1B5A87">Before: React SPA</text><rect x="83.0" y="213.5" width="839.5" height="130.0" rx="16" fill="#E3F1FB" fill-opacity=".55" stroke="#4A8DB8" stroke-width="1.5" stroke-dasharray="7 6"/><text x="97.0" y="235.5" font-size="14" font-weight="700" fill="#1B5A87">After: Astro build</text><path d="M255.0,115.0 L320.0,115.0 Q330.0,115.0 340.0,115.0 L405.0,115.0" fill="none" stroke="#24405F" stroke-width="2" marker-end="url(#a)"/><path d="M555.0,115.0 L615.2,115.0 Q625.2,115.0 635.2,115.0 L695.5,115.0" fill="none" stroke="#24405F" stroke-width="2" marker-end="url(#a)"/><path d="M255.0,285.0 L313.0,285.0 Q323.0,285.0 333.0,285.0 L391.0,285.0" fill="none" stroke="#24405F" stroke-width="2" marker-end="url(#a)"/><path d="M569.0,285.0 L604.2,285.0 Q614.2,285.0 624.2,285.0 L659.5,285.0" fill="none" stroke="#24405F" stroke-width="2" marker-end="url(#a)"/><rect x="105.0" y="87.0" width="150" height="56" rx="11" fill="#B5DEF7" stroke="#1B5A87" stroke-width="2"/><text x="180.0" y="121.0" text-anchor="middle" font-size="16" font-weight="650" fill="#0B1626">Browser</text><rect x="405.0" y="78.5" width="150" height="73" rx="11" fill="#FFFFFF" stroke="#24405F" stroke-width="2"/><text x="480.0" y="109.5" text-anchor="middle" font-size="16" font-weight="650" fill="#0B1626">Empty div</text><text x="480.0" y="130.5" text-anchor="middle" font-size="14" fill="#4A6480">+ JS bundle</text><rect x="695.5" y="78.5" width="169" height="73" rx="11" fill="#FFFFFF" stroke="#24405F" stroke-width="2"/><text x="780.0" y="109.5" text-anchor="middle" font-size="16" font-weight="650" fill="#0B1626">Content appears</text><text x="780.0" y="130.5" text-anchor="middle" font-size="14" fill="#4A6480">after JS runs</text><rect x="105.0" y="257.0" width="150" height="56" rx="11" fill="#B5DEF7" stroke="#1B5A87" stroke-width="2"/><text x="180.0" y="291.0" text-anchor="middle" font-size="16" font-weight="650" fill="#0B1626">Browser</text><rect x="391.0" y="248.5" width="178" height="73" rx="11" fill="#0B1626" stroke="#0B1626" stroke-width="2"/><text x="480.0" y="279.5" text-anchor="middle" font-size="16" font-weight="650" fill="#F4FAFF">Prerendered HTML</text><text x="480.0" y="300.5" text-anchor="middle" font-size="14" fill="#B5DEF7">per route</text><rect x="659.5" y="248.5" width="241" height="73" rx="11" fill="#FFB547" stroke="#B87A24" stroke-width="2"/><text x="780.0" y="279.5" text-anchor="middle" font-size="16" font-weight="650" fill="#0B1626">Content visible at once</text><text x="780.0" y="300.5" text-anchor="middle" font-size="14" fill="#13233A">small island: copy-link</text></svg>